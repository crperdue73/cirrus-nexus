# =============================================================================
# AEGIS — DEMO LAB 02 (CAPABILITY PROBE, CUMULUS): Two Real Switches, One Router
# =============================================================================
# WHY THIS EXISTS (2026-09-23, Selina):
#   Dad's demo-02 spec was a CAPABILITY PROBE: "we need to know what actually
#   deploys and grades before lab packs can be built." The probe had only ever
#   been run on Nokia SR Linux. This is the same shape on REAL Cumulus Linux
#   switches, so the probe answer covers BOTH switch options Dad asked about.
#
# Topology (as specified):
#
#   pc-a --- sw1(Cumulus) --- r1(FRR) --- sw2(Cumulus) --- pc-b
# 10.0.1.1/24   br0 SVI .254   .253|.253  br0 SVI .254   10.0.2.1/24
#  LEFT subnet 10.0.1.0/24          RIGHT subnet 10.0.2.0/24
#
# Design:
#   - sw1 is a REAL Cumulus Linux switch: VLAN-aware L2 bridge (br0) with the
#     L3 gateway ON THE BRIDGE ITSELF (SVI), 10.0.1.254/24. eth1 -> pc-a,
#     eth2 -> r1.
#   - sw2 mirrors it at 10.0.2.254/24. eth1 -> r1, eth2 -> pc-b.
#   - r1 (FRR) is the inter-subnet router: 10.0.1.253/24 and 10.0.2.253/24,
#     ip_forward=1.
#   - Each PC reaches the far subnet via r1 (/24-specific route; a second
#     default is not used — the default route is already owned).
#
# SVI NOTE (same fix as demo-01 Cumulus): the L3 address goes on br0 itself,
#   NOT on a br0.1 sub-interface. Putting it on a sub-interface makes the L2
#   forwarding domain and the L3 gateway path disagree -> switch IP 100% loss.
#
# CAPABILITY PROBE RESULT (verified 2026-09-23 10:10 EDT, standalone clab):
#   DEPLOYS: 5/5 nodes running (2x networkop/cx + 3 linux).
#   ROUTES : pc-a->sw1 0%, pc-a->r1 0%, pc-a->pc-b (ACROSS router) 0%.
#   PATH   : traceroute pc-a->pc-b = hop1 10.0.1.253 (r1), hop2 10.0.2.1 (pc-b).
#   Both switches fingerprinted NAME="Cumulus Linux".
# =============================================================================
metadata:
  course: CI-DEMO
  id: demo-02-two-switches-one-router-cumulus-unsolved
  validates_switch_authenticity: true
  name: "Demo 2 (Cumulus, UNSOLVED) — Two Switches and a Router 🖥️🔀📡🔀🖥️"
  description: >
    Two REAL Cumulus Linux switches joined by a real FRR router. Each switch is
    an L2 bridge with an L3 SVI used as the subnet gateway. The router forwards
    between the two subnets. Students prove the path works end-to-end from PC-A
    to PC-B across the routed boundary.
  difficulty: Intermediate
  duration_min: 35
  gradeable_nodes: [pc-a, pc-b, sw1, sw2, r1]
  grader: grader_demo_02_cumulus
  instructions:
    - 'PC-A: ip addr add 10.0.1.1/24 dev eth1 ; ip link set eth1 up ; ip route add 10.0.2.0/24 via 10.0.1.253'
    - 'PC-B: ip addr add 10.0.2.1/24 dev eth1 ; ip link set eth1 up ; ip route add 10.0.1.0/24 via 10.0.2.253'
    - 'r1 (router): sysctl -w net.ipv4.ip_forward=1 ; ip addr add 10.0.1.253/24 dev eth1 ; ip link set eth1 up ; ip addr add 10.0.2.253/24 dev eth2 ; ip link set eth2 up'
    - 'sw1 and sw2 (Cumulus Linux) are REAL switches; their bridge SVIs ship pre-configured (10.0.1.254 and 10.0.2.254).'
    - 'From PC-A: ping 10.0.1.254 (sw1), ping 10.0.1.253 (r1), ping 10.0.2.1 (PC-B across the router). All must reply.'
    - 'From PC-B: ping 10.0.1.1 (PC-A). Must reply.'
    - 'Verify the path: traceroute -n 10.0.2.1  -> hop 1 = 10.0.1.253 (r1), hop 2 = 10.0.2.1 (PC-B).'
  competencies:
    - IP addressing on hosts
    - L2 bridging on a real switch
    - Switch SVI (L3 on the bridge) as subnet gateway
    - Router interface addressing and IP forwarding
    - Static routing to a remote subnet
    - End-to-end ping and traceroute verification
  prerequisites: [demo-01-two-pcs-and-a-real-switch-cumulus]
name: aegis-demo-02-cumulus-two-switch-router
topology:
  nodes:
    pc-a:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
    pc-b:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
    sw1:
      kind: linux
      image: networkop/cx:latest
      exec:
        # Cumulus switch: VLAN-aware L2 bridge, L3 on the bridge (SVI).
        - ip link add name br0 type bridge vlan_filtering 1 vlan_default_pvid 1
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.0.1.254/24 dev br0
        - ip link set br0 up
    sw2:
      kind: linux
      image: networkop/cx:latest
      exec:
        - ip link add name br0 type bridge vlan_filtering 1 vlan_default_pvid 1
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.0.2.254/24 dev br0
        - ip link set br0 up
    r1:
      kind: linux
      image: aegis/frr:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
  links:
    - endpoints: ["pc-a:eth1", "sw1:eth1"]
    - endpoints: ["r1:eth1", "sw1:eth2"]
    - endpoints: ["r1:eth2", "sw2:eth1"]
    - endpoints: ["pc-b:eth1", "sw2:eth2"]
