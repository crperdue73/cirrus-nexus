# =============================================================================
# AEGIS — Lab 02: The Switch in the Middle
# Lesson: How does L2 forwarding work, and how does a router connect two
#   networks when a switch sits between them?
#
# Topology:
#   PC-A (10.0.1.10/24) ─── [SW1] ─── [R1] ─── PC-B (10.0.2.10/24)
#
#   SW1 = FRR-as-switch with SVI (10.0.1.2/24)
#   R1  = FRR router (eth1: 10.0.2.1/24, eth2: 10.0.1.1/24)
#
# Student tasks:
#   Part 1 — Configure SW1: hostname, bridge, SVI, passwords
#   Part 2 — Configure R1: hostname, both interfaces
#   Part 3 — Configure PC-A (Subnet A) and PC-B (Subnet B)
#   Part 4 — Verify: ping across the full path, traceroute to see the two hops
# =============================================================================
name: aegis-lab-02-switch-in-the-middle
metadata:
  course: CI-01
  id: lab-02-switch-in-the-middle
  validates_switch_authenticity: false          # audited 2026-09-22: middle device is a Linux PC (connectivity only)
  name: Lab 02 — The Switch in the Middle
  description: >
    Introduce a switch (FRR-as-switch with SVI) between one PC and the router.
    Students configure a four-device topology: PC-A sends traffic through SW1
    to R1, which routes it to PC-B on a different subnet. Teaches L2 forwarding,
    SVI management, and the full path a packet takes through a multi-device
    network.
  difficulty: Beginner–Intermediate
  duration_min: 75
  grader: grader_lab_02_switch_in_the_middle
  competencies:
    - FRR switch configuration (SVI, bridge)
    - Multi-device topology
    - L2 forwarding concepts
    - Path traversal (PC → switch → router → remote PC)
    - Traceroute interpretation
  prerequisites:
    - AEGIS Lab 01 — Crossing Subnets

topology:
  nodes:
    r1:
      kind: linux
      image: aegis/frr:latest
      exec:
        - /usr/lib/frr/frrinit.sh start
        - sleep 2
        - ip link set eth1 up      # Subnet B → PC-B
        - ip link set eth2 up      # Subnet A → SW1

    sw1:
      kind: linux
      image: aegis/frr:latest
      exec:
        - /usr/lib/frr/frrinit.sh start
        - sleep 2
        # Create bridge for L2 forwarding
        - ip link add name br0 type bridge
        - ip link set br0 up
        # Attach downstream ports to bridge
        - ip link set eth1 up      # Uplink to R1
        - ip link set eth1 master br0
        - ip link set eth2 up      # Access → PC-A
        - ip link set eth2 master br0

    pc-a:
      kind: linux
      image: alpine:latest
      exec:
        - apk add iproute2 iputils -q
        - ip link set eth1 up

    pc-b:
      kind: linux
      image: alpine:latest
      exec:
        - apk add iproute2 iputils -q
        - ip link set eth1 up

  links:
    - endpoints: ["pc-a:eth1", "sw1:eth2"]     # PC-A → SW1 (Subnet A)
    - endpoints: ["sw1:eth1", "r1:eth2"]        # SW1 → R1 (Subnet A)
    - endpoints: ["r1:eth1", "pc-b:eth1"]       # R1 → PC-B (Subnet B)
