metadata:
  course: CI-00
  competencies:
  - IP Addressing
  - Ethernet Basics
  - Ping Verification
  description: Assign IP addresses to two computers connected through a switch, then
    verify they can communicate using ping.
  difficulty: Beginner
  duration_min: 30
  gradeable_nodes:
  - pc-a
  - pc-b
  grader: grader_tier01
  id: tier-01-foundation
  validates_switch_authenticity: false          # audited 2026-09-22: middle device is a Linux PC (connectivity only)
  instructions:
  - Click into the terminal for PC-A
  - 'Assign IP: 10.0.1.1/24 on eth1'
  - 'Bring the interface up: ip link set eth1 up'
  - Click into the terminal for PC-B
  - 'Assign IP: 10.0.1.2/24 on eth1'
  - 'Bring the interface up: ip link set eth1 up'
  - 'From PC-A, ping PC-B: ping 10.0.1.2'
  name: "Foundation \u2014 Make Two Computers Talk \U0001F5A5\uFE0F\U0001F5A5\uFE0F"
  tip: Use ip addr show eth1 to check your config
name: aegis-tier-01-foundation
topology:
  links:
  - endpoints:
    - pc-a:eth1
    - switch:eth1
  - endpoints:
    - pc-b:eth1
    - switch:eth2
  nodes:
    pc-a:
      exec:
      - apk add iproute2 iputils -q
      image: alpine:latest
      kind: linux
    pc-b:
      exec:
      - apk add iproute2 iputils -q
      image: alpine:latest
      kind: linux
    switch:
      kind: linux
      image: alpine:latest
      exec:
      - apk add bridge-utils iproute2 -q
      - ip link add name br0 type bridge
      - ip link set br0 up
      - ip link set eth1 up
      - ip link set eth1 master br0
      - ip link set eth2 up
      - ip link set eth2 master br0
