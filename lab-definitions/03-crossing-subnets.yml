# =============================================================================
# AEGIS — Lab 01: Crossing Subnets
# Lesson: What happens when a packet leaves its network?
#   Students configure a router (FRR/vtysh) with two interfaces on different
#   subnets, set up two PCs with default gateways, and verify a ping crosses
#   the router for the first time.
#
# Topology:
#   PC-A (10.0.1.10/24) ─── [R1 eth1]  R1  [R1 eth2] ─── PC-B (10.0.2.10/24)
#
# Student tasks:
#   Part 1 — Router Basics: hostname, enable password, password-encryption
#   Part 2 — Interface Config: IPs on eth1 + eth2, no shutdown
#   Part 3 — PC Config: IPs + default gateways on PC-A and PC-B
#   Part 4 — Verification: ping + traceroute across the router
# =============================================================================
name: aegis-lab-01-crossing-subnets
metadata:
  course: CI-01
  id: lab-01-crossing-subnets
  name: Lab 01 — Crossing Subnets
  description: >
    Configure an FRR router with two interfaces on different subnets, set up
    two Alpine PCs with default gateways, and verify end-to-end connectivity
    across the router. This is the first time students see a packet leave its
    local network and get routed to a different subnet.
  difficulty: Beginner
  duration_min: 60
  grader: grader_tier02_crossing
  competencies:
    - FRR/vtysh CLI basics (configure terminal, interface config)
    - Router security (enable password, service password-encryption)
    - Interface addressing (ip address, no shutdown)
    - Default gateway concept
    - End-to-end connectivity (ping, traceroute)
  prerequisites:
    - AEGIS Lab 00 — Foundation (IP addressing, ip addr, ping basics)

topology:
  nodes:
    r1:
      kind: linux
      image: aegis/frr:latest
      # Student task: configure hostname, passwords, interfaces via vtysh
      exec:
        - /usr/lib/frr/frrinit.sh start
        - sleep 2
        # Interfaces brought up but NOT configured — student does that
        - ip link set eth1 up
        - ip link set eth2 up

    pc-a:
      kind: linux
      image: alpine:latest
      # Student task: assign IP and default gateway
      exec:
        - apk add iproute2 iputils -q
        # Interface left up but NO IP — student assigns manually
        - ip link set eth1 up

    pc-b:
      kind: linux
      image: alpine:latest
      # Student task: assign IP and default gateway
      exec:
        - apk add iproute2 iputils -q
        - ip link set eth1 up

  links:
    - endpoints: ["pc-a:eth1", "r1:eth1"]     # Subnet A: 10.0.1.0/24
    - endpoints: ["r1:eth2", "pc-b:eth1"]     # Subnet B: 10.0.2.0/24
