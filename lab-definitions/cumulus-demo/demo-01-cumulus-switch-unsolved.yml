# =============================================================================
# AEGIS — DEMO LAB 01 (REAL SWITCH, CUMULUS) — UNSOLVED STUDENT VARIANT
# =============================================================================
# WHY THIS EXISTS (2026-09-23, Selina):
#   The Cumulus branch was verified only on the SOLVED reference variant
#   (demo-01-two-pcs-and-a-real-switch-cumulus), whose PCs ship configured via
#   `exec`. That proves the GRADER and the SWITCH, but it does NOT prove "a
#   student can do the work on Cumulus" the way demo-01-...-unsolved proves it
#   on SR Linux. My self-audit (SELF-AUDIT-20260923-selina.md, edge [3]) flagged
#   that as a CLAIM not earned. This lab is the variant that earns it.
#
# DIFFERENCE FROM THE SOLVED VARIANT:
#   - PCs ship UNCONFIGURED: no address, no `ip addr add` in exec. The student
#     assigns 10.0.1.1/24 and 10.0.1.2/24 and brings eth1 up. (Same discipline
#     as the SR Linux unsolved lab.)
#   - The switch SVI (10.0.1.254/24 on br0) STILL ships pre-configured, matching
#     the SR Linux unsolved lab, whose IRB also ships pre-configured ("that is
#     deliberate: this lab is about host addressing ... not switch bring-up").
#   - The grader is unchanged (grader_demo_01_cumulus): it fingerprints Cumulus
#     via /etc/os-release + vtysh, so a plain Linux bridge still cannot pass.
#
# Pass condition (NOT softened): pc-a pings BOTH 10.0.1.254 (switch) AND
#   10.0.1.2 (pc-b), 0% loss. PC-to-PC alone does NOT count.
#
# Topology:
#     pc-a ────────── sw1 (Cumulus) ────────── pc-b
#   10.0.1.1/24         10.0.1.254/24          10.0.1.2/24
# =============================================================================
metadata:
  course: CI-DEMO
  id: demo-01-two-pcs-and-a-real-switch-cumulus-unsolved
  validates_switch_authenticity: true
  name: "Demo — Two PCs and a Real Switch (Cumulus, UNSOLVED)"
  description: >
    Two computers through a REAL Cumulus Linux switch. The PCs ship
    unconfigured — your job is to address them and prove the path works by
    pinging BOTH the switch and the other PC from PC-A. The switch's bridge SVI
    arrives pre-configured (that is deliberate: this lab is about host
    addressing and reaching the switch, not switch bring-up).
  difficulty: Beginner
  duration_min: 25
  gradeable_nodes:
    - pc-a
    - pc-b
    - sw1
  grader: grader_demo_01_cumulus
  instructions:
    - Click into the terminal for PC-A
    - 'Assign an IP: ip addr add 10.0.1.1/24 dev eth1'
    - 'Bring the interface up: ip link set eth1 up'
    - Click into the terminal for PC-B
    - 'Assign an IP: ip addr add 10.0.1.2/24 dev eth1'
    - 'Bring the interface up: ip link set eth1 up'
    - 'The switch (Cumulus Linux) is a REAL switch; its bridge SVI 10.0.1.254/24 ships pre-configured.'
    - 'From PC-A, prove the lab: ping 10.0.1.254 (the switch) AND ping 10.0.1.2 (PC-B). Both must reply.'
  competencies:
    - IP addressing on a host
    - Management IP on a switch (SVI / L3-on-the-bridge)
    - Interface bring-up
    - L2 bridging vs L3 gateway on a switch
    - Ping verification (host-to-switch, host-to-host)
  prerequisites: []
name: aegis-demo-01-cumulus-switch-unsolved
topology:
  nodes:
    pc-a:
      kind: linux
      image: alpine:latest
      exec:
        - apk add iproute2 iputils -q
        # Interface left up but NO IP — student assigns manually.
        - ip link set eth1 up
    pc-b:
      kind: linux
      image: alpine:latest
      exec:
        - apk add iproute2 iputils -q
        - ip link set eth1 up
    sw1:
      kind: linux
      image: networkop/cx:latest
      exec:
        # Cumulus switch: VLAN-aware L2 bridge, L3 address on the bridge (SVI).
        # SVI ships pre-configured (see header).
        - ip link add name br0 type bridge vlan_filtering 1 vlan_default_pvid 1
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.0.1.254/24 dev br0
        - ip link set br0 up
  links:
    - endpoints: ["pc-a:eth1", "sw1:eth1"]
    - endpoints: ["pc-b:eth1", "sw1:eth2"]
