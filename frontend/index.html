<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS — Network Education & User Simulation</title>
    <!-- Removed 2026-09-27 (Selina): two unpkg.com CDN script tags for htmx 2.0.4
         were loaded but NEVER USED - no hx-* attributes exist anywhere in this
         document and every action is a plain fetch(). They were the app's ONLY
         external dependency, and they made the demo depend on internet access
         for no functional gain. Removal verified: page and lab flow fully intact
         offline (chromium --host-resolver-rules="MAP unpkg.com 0.0.0.0").
         Backup: frontend/index.html.bak-2026-09-27-htmx -->
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-2: #242738;
            --border: #2d3145;
            --text: #e1e3eb;
            --text-muted: #8b8fa3;
            --accent: #00d4aa;
            --accent-dim: #009977;
            --success: #00d46a;
            --warning: #ffb347;
            --error: #ff4770;
            --font: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: var(--bg);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .lab-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: border-color 0.2s;
        }

        .lab-card:hover {
            border-color: var(--accent);
        }

        .lab-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .lab-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .lab-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .lab-tag {
            background: var(--surface-2);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .lab-tag.accent {
            color: var(--accent);
            border: 1px solid var(--accent-dim);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-primary:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent-dim);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .student-input {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            justify-content: center;
        }

        .student-input input {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text);
            font-size: 14px;
            width: 250px;
            font-family: inherit;
        }

        .student-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .lab-session {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }

        .terminal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 16px 0;
        }

        .terminal-frame {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            height: 550px;
            display: flex;
            flex-direction: column;
        }

        .terminal-frame iframe {
            width: 100%;
            flex: 1;
            border: none;
        }

        .terminal-label {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 12px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            font-family: var(--font);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .terminal-label .term-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Fullscreen-one-terminal mode. The chosen frame is lifted out of the
           grid and pinned over the whole viewport, so a student on a small or
           projector screen can actually read it. The grid keeps its space so
           returning to the small view does not reflow the page. */
        .terminal-frame.fullscreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .terminal-frame.fullscreen .terminal-label {
            font-size: 14px;
            padding: 10px 16px;
        }

        body.term-fullscreen-active {
            overflow: hidden;
        }

        .term-btn {
            font-family: var(--font);
            font-size: 12px;
            line-height: 1;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            flex-shrink: 0;
            transition: color .12s, border-color .12s, background .12s;
        }

        .term-btn:hover {
            color: var(--text);
            border-color: var(--text-muted);
            background: var(--surface);
        }

        .term-btn:focus-visible {
            outline: 2px solid var(--accent, #6ea8fe);
            outline-offset: 1px;
        }

        .lab-instructions {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
        }

        .lab-instructions code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .grade-result {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .grade-result.passed {
            border-color: var(--success);
        }

        .grade-result.failed {
            border-color: var(--error);
        }

        .grade-result.error {
            border-color: var(--error);
            background: rgba(220, 53, 69, 0.08);
        }

        .grade-result.refused {
            border-style: dashed;
            background: rgba(255, 193, 7, 0.08);
        }

        .grade-score {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .grade-feedback {
            list-style: none;
        }

        .grade-feedback li {
            padding: 6px 0;
            font-size: 14px;
        }

        .competency-badge {
            display: inline-block;
            background: var(--accent-dim);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 4px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .terminal-grid {
                grid-template-columns: 1fr;
            }
            .student-input {
                flex-direction: column;
                align-items: center;
            }
            .student-input input {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">Δ</div>
            <div>
                <div class="logo-text">NEXUS</div>
                <div class="logo-sub">Network Education & User Simulation</div>
            </div>
        </div>
        <div id="session-indicator"></div>
    </div>

    <div class="container">
        <div class="hero">
            <h1>Welcome to NEXUS</h1>
            <p>Hands-on IT labs that grade themselves. Pick a lab, configure real network devices in your browser, and get instant feedback.</p>
        </div>

        <!-- Student Name -->
        <div class="student-input" id="student-setup">
            <input type="text" id="student-name" placeholder="Enter your name" value="Student" />
            <button class="btn btn-primary" onclick="loadLabs()">Get Started →</button>
        </div>

        <!-- Lab Catalog -->
        <div id="lab-catalog" class="hidden">
            <!-- Course Filter Bar -->
            <div id="course-filter" style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;"></div>
              <!-- Notice area: messages live HERE so the filter/cards are never destroyed -->
              <div id="catalog-notice"></div>
            <!-- Lab Cards Container -->
            <div id="lab-cards"></div>
        </div>

        <!-- Live Sessions (server truth; survives reload / different tab) -->
        <div id="live-sessions" class="hidden" style="margin:24px 0;"></div>

        <!-- Active Session -->
        <div id="active-session" class="hidden"></div>
    </div>

    <script>
var currentSession = null;
var currentLab = null;

// Live-sessions panel: the app's session list, not this tab's memory.
// Lets an operator see and stop sessions it did not personally start.
async function loadLiveSessions() {
    var panel = document.getElementById('live-sessions');
    var resp;
    try {
        resp = await fetch('/api/sessions');
    } catch (e) {
        panel.classList.add('hidden');
        return;
    }
    if (!resp.ok) { panel.classList.add('hidden'); return; }
    var data;
    try {
        data = await resp.json();
    } catch (e) {
        // RUN 208: this parse sat OUTSIDE the try above. A non-JSON answer -- a proxy, an HTML error
        // page, a truncated body -- threw inside an async function that no caller awaits, so it
        // became an unhandled rejection and the panel silently never updated. Same class as runs
        // 206/207: an async failure with no handler is invisible to the student.
        panel.classList.add('hidden');
        return;
    }
    var sessions = data.sessions || [];
    if (sessions.length === 0) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }

    var rows = sessions.map(function(s) {
        var digest = (s.runtime_digest || '').slice(0, 24);
        // Reconnect: if this session already served terminals, offer them back. A
        // page refresh used to leave a student with only a Stop button on their own
        // running lab (2026-09-28).
        var canReconnect = s.ttyd && Object.keys(s.ttyd).length > 0;
        var reconnectBtn = canReconnect
            ? '<button class="btn btn-secondary" style="padding:4px 12px;font-size:12px;white-space:nowrap;" ' +
              'onclick="reconnectSession(\'' + escapeHtml(s.session_id) + '\')">\u21bb Reconnect</button>'
            : '';
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;' +
            'padding:10px 14px;border:1px solid var(--border,#333);border-radius:8px;margin-bottom:8px;">' +
            '<div style="text-align:left;min-width:0;">' +
            '<div style="font-size:14px;font-weight:600;">' + escapeHtml(s.lab_id) + '</div>' +
            '<div style="font-size:12px;opacity:0.7;">' + escapeHtml(s.student_name || '') +
            ' \u00b7 ' + (s.nodes ? s.nodes.length : 0) + ' nodes \u00b7 id ' +
            escapeHtml(s.session_id) + '</div>' +
            '<div style="font-size:11px;opacity:0.55;font-family:monospace;">substrate: ' +
            escapeHtml(digest || '(no digest)') + '</div>' +
            (s.runtime_digest_matches === false
                ? '<div style="font-size:11px;color:var(--error);">\u26a0\ufe0f substrate changed since this lab started \u2014 grades will refuse; end and restart the lab</div>'
                : '') +
            '</div>' +
            '<div style="display:flex;gap:8px;white-space:nowrap;">' + reconnectBtn +
            '<button class="btn btn-danger" style="padding:4px 12px;font-size:12px;white-space:nowrap;" ' +
            'onclick="stopSessionById(\'' + escapeHtml(s.session_id) + '\')">\u2715 Stop</button></div>' +
            '</div>';
    }).join('');

    panel.innerHTML = '<h3 style="font-size:15px;margin-bottom:12px;text-align:left;">\u23f1 Running sessions (' +
        sessions.length + ')</h3>' + rows;
    panel.classList.remove('hidden');
}

// RUN 207: neither stop path had a handler. A failed stop became an UNHANDLED REJECTION -- the button
// appeared to do nothing, the lab kept running, and nothing on screen said so. Say it out loud.
function _stopFailed(e) {
    var ind = document.getElementById('session-indicator');
    var msg = '\u26a0\ufe0f Could not end the lab (' + String((e && e.message) || e) + '). It is still running \u2014 press End Lab again.';
    if (ind) { ind.innerHTML = '<span style="color:var(--error);font-size:13px;">' + msg + '</span>'; }
    else { alert(msg); }
}
async function stopSessionById(sid) {
    try {
        var _r = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/stop', { method: 'POST' });
        if (!_r.ok && _r.status !== 404) { throw new Error('HTTP ' + _r.status); }
    } catch (e) { _stopFailed(e); return; }
    if (currentSession === sid) {
        currentSession = null;
        currentLab = null;
        document.getElementById('active-session').classList.add('hidden');
        document.getElementById('session-indicator').innerHTML = '';
        document.getElementById('lab-catalog').classList.remove('hidden');
    }
    loadLiveSessions();
    loadLabs();
}

// Re-attach to a lab the student already has running - the recovery path after a
// page refresh. Added 2026-09-28: previously a refresh left a student with only a
// Stop button on their own running lab, and pressing Start again quietly created a
// SECOND full session (two sets of containers). This rebuilds the terminal view
// against the EXISTING session; it never starts a new one.
async function reconnectSession(sid) {
    var catalog = document.getElementById('lab-catalog');
    var sessionDiv = document.getElementById('active-session');
    try {
        var listResp = await fetch('/api/sessions');
        var list = await listResp.json();
        var entry = (list.sessions || []).filter(function(s) { return s.session_id === sid; })[0];
        if (!entry) throw new Error('That session is no longer running.');

        // getSessionHTML() needs the lab definition (instructions, gradeable nodes).
        var labsResp = await fetch('/api/labs');
        var labs = (await labsResp.json()).labs || [];
        var lab = labs.filter(function(l) { return l.id === entry.lab_id; })[0] || { id: entry.lab_id, name: entry.lab_id };

        var data = {
            session_id: entry.session_id,
            lab: lab,
            nodes: entry.nodes,
            ttyd: entry.ttyd || {},
            status: entry.status
        };
        currentSession = entry.session_id;
        currentLab = entry.lab_id;

        catalog.classList.add('hidden');
        sessionDiv.classList.remove('hidden');
        sessionDiv.innerHTML = getSessionHTML(data);

        var grid = document.getElementById('terminal-grid');
        if (grid) {
            var ttyd = data.ttyd;
            (data.nodes || []).forEach(function(name) {
                var url = (ttyd[name] && ttyd[name].url) ? ttyd[name].url : 'about:blank';
                var frame = document.createElement('div');
                frame.innerHTML = '<div class="terminal-frame"><div class="terminal-label">' +
                    '<span class="term-name">' + escapeHtml(name) + '</span>' +
                    '<button type="button" class="term-btn" title="Expand this terminal">\u26f6 Expand</button>' +
                    '</div><iframe src="' + url + '"></iframe></div>';
                grid.appendChild(frame.firstElementChild);
            });
        }
        loadLiveSessions();
    } catch (e) {
        catalogNotice('<div style="text-align:center;color:var(--error);padding:24px;">' +
            '\u26a0\ufe0f Could not reconnect: ' + escapeHtml(e.message) +
            '<div style="margin-top:16px;"><button class="btn btn-secondary" onclick="loadLabs()">\u2190 Back</button></div>' +
            '</div>');
        catalog.classList.remove('hidden');
    }
}

// Show a message in the catalog WITHOUT destroying it. Clobbering #lab-catalog's innerHTML used to
// delete #course-filter and #lab-cards; loadLabs() then threw on a null element -- inside an async
// function, so it surfaced as a silent unhandled rejection. A student who pressed End Lab saw the
// deploying notice stay on screen forever with no lab list and no error. Found live 2026-10-05 (run 206).
function catalogNotice(html) {
    var n = document.getElementById('catalog-notice');
    var f = document.getElementById('course-filter');
    var c = document.getElementById('lab-cards');
    if (!n) { return; }
    n.innerHTML = html || '';
    var show = html ? 'none' : '';
    if (f) { f.style.display = show; }
    if (c) { c.style.display = show; }
}

async function loadLabs() {
    const name = document.getElementById('student-name').value.trim() || 'Student';
    document.getElementById('student-setup').classList.add('hidden');

    // FIX 2026-09-28 (Selina, cron run 35): this is the FIRST call on page load
    // and it had no try/catch and no !resp.ok guard. If /api/labs failed - the
    // server restarting, which nexus.service does with RestartSec=10, proven live -
    // resp.json() threw, the name-entry screen had already been hidden, and the
    // student was left on a BLANK PAGE with no error and no retry. The entry point
    // failing silently is worse than the grading bug fixed in run 33.
    let resp, data;
    try {
        resp = await fetch('/api/labs');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        data = await resp.json();
    } catch (e) {
        document.getElementById('student-setup').classList.remove('hidden');
        var errBox = document.getElementById('lab-catalog');
        errBox.classList.remove('hidden');
        catalogNotice('<div style="text-align:center;color:var(--error);padding:24px;">' +
            '\u26a0\ufe0f Could not load the lab list. The server may be starting up.' +
            '<div style="margin-top:16px;"><button class="btn" onclick="loadLabs()">\u21bb Try again</button></div>' +
            '</div>');
        return;
    }
    const catalog = document.getElementById('lab-catalog');
    catalog.classList.remove('hidden');
    catalogNotice('');   // clear any message and bring the filter/cards back

    // If this browser started a lab recently and it has not appeared yet, SAY SO (run 205).
    try {
        var _dep = JSON.parse(localStorage.getItem('aegis_deploying') || 'null');
        if (_dep && _dep.t && (Date.now() - _dep.t) < 300000) {
            var _mins = Math.round((Date.now() - _dep.t) / 60000);
            var _el = document.createElement('div');
            _el.id = 'deploying-notice';
            _el.style.cssText = 'text-align:center;color:var(--accent);padding:10px 14px;margin-bottom:14px;border:1px solid var(--accent-dim);border-radius:8px;font-size:13px;';
            _el.innerHTML = '\u23f3 A lab was started here ' + (_mins < 1 ? 'less than a minute' : _mins + ' minute(s)') +
                ' ago and is not listed yet. It can take a few minutes on a first run \u2014 it will appear under \u201cRunning sessions\u201d when ready. Waiting (or reloading) beats starting a second one.';
            if (catalog.firstChild) { catalog.insertBefore(_el, catalog.firstChild); } else { catalog.appendChild(_el); }
        }
    } catch (e) {}

    var labs = data.labs;

    // Build course filter buttons
    var courses = {};
    for (var i = 0; i < labs.length; i++) {
        var c = labs[i].course || 'Uncategorized';
        courses[c] = (courses[c] || 0) + 1;
    }
    var courseKeys = Object.keys(courses).sort();

    var filterHtml = '<button class="btn btn-secondary filter-btn" data-course="all" onclick="filterLabs(\'all\')" style="font-size:13px;">\ud83d\udcca All</button>';
    for (var i = 0; i < courseKeys.length; i++) {
        var c = courseKeys[i];
        var label = c === 'Uncategorized' ? '\ud83d\udfe2 Other' : c;
        filterHtml += '<button class="btn btn-secondary filter-btn" data-course="' + escapeHtml(c) + '" onclick="filterLabs(\'' + escapeHtml(c).replace(/'/g, "\\'") + '\')" style="font-size:13px;">' + label + ' (' + courses[c] + ')</button>';
    }
    document.getElementById('course-filter').innerHTML = filterHtml;
    // Highlight All as active
    document.querySelectorAll('.filter-btn').forEach(function(b) {
        if (b.getAttribute('data-course') === 'all') {
            b.style.borderColor = 'var(--accent)';
            b.style.color = 'var(--accent)';
        }
    });

    // Render all lab cards with course badge
    var activeFilter = window._activeFilter || 'all';
    var cardHtml = labs.map(function(lab, index) {
        var escapedId = lab.id.replace(/'/g, "\\'");
        var escapedName = name.replace(/'/g, "\\'");
        var courseBadge = (lab.course) ? '<span class="lab-tag" style="border-color:var(--accent-dim);color:var(--accent);">' + escapeHtml(lab.course) + '</span>' : '';
        var show = (activeFilter === 'all' || (lab.course || 'Uncategorized') === activeFilter) ? '' : ' style="display:none;"';
        return '<div class="lab-card" style="margin-bottom: 16px;" data-course="' + escapeHtml(lab.course || 'Uncategorized') + '"' + show + '>' +
            '<h2>' + lab.name + '</h2>' +
            '<p class="lab-desc">' + lab.description + '</p>' +
            '<div class="lab-meta">' +
            '<span class="lab-tag">\u23f1\ufe0f ' + lab.duration_min + ' min</span>' +
            '<span class="lab-tag accent">' + lab.difficulty + '</span>' +
            courseBadge +
            (lab.competencies || []).map(function(c) {
                return '<span class="lab-tag">\u{1f3af} ' + escapeHtml(c) + '</span>';
            }).join('') +
            '</div>' +
            '<div class="actions">' +
            '<button class="btn btn-primary" onclick="startLab(\'' + escapedId + '\', \'' + escapedName + '\')">' +
            '\u25b6 Start Lab</button>' +
            '<button class="btn btn-secondary" onclick="window.open(\'/api/labs/' + escapedId + '/topology\', \'_blank\')">' +
            '\u{1f5fa} Topology</button>' +
            '<button class="btn btn-secondary" onclick="openLabGuide(\'' + escapedId + '\')">' +
            '\u{1f4d6} Lab Guide</button>' +
            '</div>' +
            '</div>';
    }).join('');
    document.getElementById('lab-cards').innerHTML = cardHtml;
}

function filterLabs(course) {
    window._activeFilter = course;

    // Update button highlights
    document.querySelectorAll('.filter-btn').forEach(function(b) {
        if (b.getAttribute('data-course') === course) {
            b.style.borderColor = 'var(--accent)';
            b.style.color = 'var(--accent)';
        } else {
            b.style.borderColor = '';
            b.style.color = '';
        }
    });

    // Show/hide lab cards
    document.querySelectorAll('#lab-cards .lab-card').forEach(function(card) {
        if (course === 'all' || card.getAttribute('data-course') === course) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
}

function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

function openLabGuide(labId) {
    window.open('/api/labs/' + encodeURIComponent(labId) + '/guide', '_blank');
}

async function startLab(labId, studentName) {
    const catalog = document.getElementById('lab-catalog');
    catalogNotice('<p style="text-align:center;color:var(--text-muted);">\u23f3 Deploying your lab environment&hellip;</p>'+'<p style="text-align:center;color:var(--text-muted);font-size:13px;">This usually takes under a minute. On a first run it can take several minutes while the container images download &mdash; the page will continue on its own.</p>');
    // Remember that a deploy was issued in THIS browser, because /api/sessions does not list it yet.
    // Measured 2026-10-05 (run 205): containers exist ~3s in, but the session appears in the list only
    // at ~46s -- a 43s blind window. A student who reloads inside it sees an empty list, and the
    // natural next move (press Start again) doubles the deployment (run 203: duplicates are allowed).
    try { localStorage.setItem('aegis_deploying', JSON.stringify({lab: labId, t: Date.now()})); } catch (e) {}

    var resp, data;
    try {
        resp = await fetch('/api/sessions/start?lab_id=' + encodeURIComponent(labId) +
            '&student_name=' + encodeURIComponent(studentName), { method: 'POST' });
        data = await resp.json();
    } catch (e) {
        catalogNotice('<div style="text-align:center;color:var(--error);">' +
            '\u274c Failed to start lab. Is the server running?</div>' +
            '<div style="text-align:center;margin-top:16px;">' +
            '<button class="btn btn-secondary" onclick="loadLabs()">\u2190 Back</button></div>');
        return;
    }

    if (!resp.ok) {
        var detail = data.detail || 'Unknown error';
        catalogNotice('<div style="text-align:center;color:var(--error);">' +
            '\u274c This lab could not be started: ' + escapeHtml(detail) + '</div>' +
            '<div style="text-align:center;margin-top:16px;">' +
            '<button class="btn btn-secondary" onclick="loadLabs()">\u2190 Back</button></div>');
        return;
    }

    currentSession = data.session_id;
    try { localStorage.removeItem('aegis_deploying'); } catch (e) {}
    currentLab = data.lab;

    catalog.classList.add('hidden');
    const sessionDiv = document.getElementById('active-session');
    sessionDiv.classList.remove('hidden');
    sessionDiv.innerHTML = getSessionHTML(data);

    // Add terminal iframes
    setTimeout(function() {
        const grid = document.getElementById('terminal-grid');
        if (!grid) return;
        var nodes = data.nodes || {};
        var ttyd = data.ttyd || {};
        var nodeEntries = Object.entries(nodes);
        for (var i = 0; i < nodeEntries.length; i++) {
            var name = nodeEntries[i][0];
            var containerName = nodeEntries[i][1];
            var url = (ttyd[name] && ttyd[name].url) ? ttyd[name].url : 'about:blank';
            var frame = document.createElement('div');
            frame.innerHTML = '<div class="terminal-frame"><div class="terminal-label">' +
                '<span class="term-name">' + escapeHtml(name) + ' - ' + escapeHtml(containerName) + '</span>' +
                '<button type="button" class="term-btn" title="Expand this terminal" ' +
                'aria-label="Expand terminal ' + escapeHtml(name) + '">\u26f6 Expand</button>' +
                '</div><iframe src="' + url + '"></iframe></div>';
            grid.appendChild(frame.firstElementChild);
        }
    }, 100);
}

function getSessionHTML(data) {
    var lab = data.lab || {};
    var instructions = lab.instructions || [];
    var tip = lab.tip || '';
    var gradeableNodes = lab.gradeable_nodes || [];

    // RUN 247: the start-success view is where a student actually reads about their session, and
    // it said nothing about WHICH substrate the session is pinned to. The identity lived only in
    // the side panel, as a truncated unlabeled hash, and the pinned image's NAME was shown
    // nowhere a human looks -- so a student (or the operator) could not tell 'aegis/frr' from
    // anything else. Surface the identity here, in words.
    var substrateHtml = '';
    var _digest = String(data.runtime_digest || '');
    var _img = String(lab.substrate_image || '');
    var _short = _digest ? _digest.slice(0, 24) : '';
    if (_digest.indexOf('sha256:') === 0) {
        substrateHtml = '<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0 0;">' +
            '\u{1f512} Pinned substrate: ' + escapeHtml(_img || 'AEGIS substrate') +
            (_short ? ' \u00b7 ' + escapeHtml(_short) : '') + '</p>';
    } else if (_digest.indexOf('aegis-less:') === 0) {
        substrateHtml = '<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0 0;">' +
            '\u{1f512} Pinned substrate: none \u2014 this lab runs no AEGIS substrate ' +
            '(identity is a hash over its node images' + (_short ? ': ' + escapeHtml(_short) : '') + ')</p>';
    } else {
        substrateHtml = '<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0 0;">' +
            '\u{1f512} Pinned substrate: (no runtime identity)</p>';
    }

    // Build dynamic instructions
    var instructionsHtml = '';
    if (instructions.length > 0) {
        instructionsHtml = '<div class="lab-instructions">' +
            '<strong>\u{1f4cb} Your Task:</strong><ol style="margin:8px 0 0 16px;padding:0;">';
        for (var i = 0; i < instructions.length; i++) {
            instructionsHtml += '<li style="padding:4px 0;">' + escapeHtml(instructions[i]) + '</li>';
        }
        instructionsHtml += '</ol>';
        if (tip) {
            instructionsHtml += '<p style="margin:8px 0 0 0;color:var(--accent);font-size:13px;">' +
                '\u{1f4a1} Tip: ' + escapeHtml(tip) + '</p>';
        }
        instructionsHtml += '</div>';
    }

    // Build dynamic check buttons
    var checkButtonsHtml = '';
    if (gradeableNodes.length > 0) {
        checkButtonsHtml = '<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">';
        for (var i = 0; i < gradeableNodes.length; i++) {
            var nodeName = gradeableNodes[i];
            var label = 'Check ' + nodeName;
            checkButtonsHtml += '<button class="btn btn-primary" onclick="submitGrade(\'' +
                nodeName.replace(/'/g, "\\'") + '\')">' + escapeHtml(label) + '</button>';
        }
        checkButtonsHtml += '</div>';
    }

    return '<div class="lab-session">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
        '<div><h2 style="font-size:18px;">\u{1f9ea} ' + escapeHtml(lab.name || '') + '</h2>' +
        '<p style="font-size:13px;color:var(--text-muted);">Session: ' + escapeHtml(data.session_id || '') + '</p>' +
        substrateHtml +
        '</div>' +
        '<div><button class="btn btn-danger" onclick="stopSession()">\u2715 End Lab</button></div></div>' +

        instructionsHtml +

        '<div class="terminal-grid" id="terminal-grid"></div>' +

        checkButtonsHtml +

        '<div id="grade-result"></div></div>';
}

async function submitGrade(node) {
    var resultDiv = document.getElementById('grade-result');
    resultDiv.innerHTML = '<p style="color:var(--text-muted);">\u23f3 Grading...</p>';

    // FIX 2026-09-28 (Selina, cron run 33): this handler had no try/catch and no
    // !resp.ok guard, but it DOES read data.grade below. A network blip or a
    // server restart (nexus.service has RestartSec=10 - proven live) rejected the
    // fetch, left "Grading..." on screen forever, and a non-OK JSON body made
    // `grade.passed` throw a TypeError. Every other handler that guards does so;
    // this one - the only one that indexes into the response - did not.
    var resp, data;
    try {
        resp = await fetch('/api/sessions/' + currentSession + '/submit?node=' + encodeURIComponent(node), { method: 'POST' });
        data = await resp.json();
    } catch (e) {
        resultDiv.innerHTML = '<div class="grade-result error">' +
            '<div class="grade-score">\u26a0\ufe0f Cannot grade</div>' +
            '<ul class="grade-feedback"><li>' +
            'Could not reach the grading service (the connection dropped or the server restarted). ' +
            'Your lab is still running - press Grade again.' +
            '</li></ul></div>';
        return;
    }

    // Refusal path: no attributable substrate => 409, no `grade` object. Render
    // it as its own state. Falling through to `data.grade` here would throw.
    if (resp.status === 409) {
        resultDiv.innerHTML = '<div class="grade-result refused">' +
            '<div class="grade-score">\u26a0\ufe0f Cannot grade</div>' +
            '<ul class="grade-feedback"><li>' +
            escapeHtml(data.detail || 'Session has no runtime digest; state is unattributable.') +
            '</li></ul></div>';
        return;
    }

    // Any other non-OK response carries a `detail`, not a `grade`. Report it
    // instead of crashing on `grade.passed`.
    if (!resp.ok || !data || !data.grade) {
        resultDiv.innerHTML = '<div class="grade-result error">' +
            '<div class="grade-score">\u26a0\ufe0f Cannot grade</div>' +
            '<ul class="grade-feedback"><li>' +
            escapeHtml((data && data.detail) || ('Grading failed (HTTP ' + resp.status + ').')) +
            '</li></ul></div>';
        return;
    }

    var grade = data.grade;
    var passed = grade.passed;
    var status = grade.status || 'graded';
    var feedback = grade.feedback || [];
    var competencies = grade.competencies || [];

    // Grader crash is NOT a verdict. Show it as an error, never as "Not yet".
    var headHtml;
    if (status === 'error') {
        headHtml = '\u26a0\ufe0f Grader error';
    } else if (passed) {
        headHtml = '\u2705 Passed!';
    } else {
        headHtml = '\u274c Not yet';
    }
    var resultHTML = '<div class="grade-result ' +
        (status === 'error' ? 'error' : (passed ? 'passed' : 'failed')) + '">' +
        '<div class="grade-score">' + headHtml;
    if (status !== 'error') {
        resultHTML += '<span style="font-size:16px;font-weight:normal;color:var(--text-muted);margin-left:12px;">' +
            Math.round(grade.score * 100) + '%</span>';
    }
    resultHTML += '</div><ul class="grade-feedback">';
    for (var j = 0; j < feedback.length; j++) {
        resultHTML += '<li>' + feedback[j] + '</li>';
    }
    resultHTML += '</ul>';
    if (competencies.length > 0) {
        resultHTML += '<div style="margin-top:12px;"><strong style="font-size:13px;">Competencies Earned:</strong>';
        for (var k = 0; k < competencies.length; k++) {
            resultHTML += '<span class="competency-badge">' + escapeHtml(competencies[k]) + '</span>';
        }
        resultHTML += '</div>';
    }
    resultHTML += '</div>';
    resultDiv.innerHTML = resultHTML;

    if (passed) {
        // FIX 2026-10-04 (run 177): one node passing is NOT the lab passing.
        // This used to print "Lab Complete!" on any single node pass -- and because both
        // labs ship their switches PRE-CONFIGURED, a student who did zero work, pressed
        // Check on sw1 alone, and saw "Lab Complete!" while the server's verdict was still
        // `running` and pc-a/pc-b were untouched. The server was fixed for exactly this on
        // 2026-09-27 (_lab_verdict_passed: "submitted" must mean the LAB passed); the UI
        // was still inferring it from one node. ASK THE SERVER instead of inferring.
        var labDone = false;
        try {
            var sResp = await fetch('/api/sessions/' + encodeURIComponent(currentSession));
            if (sResp.ok) { labDone = ((await sResp.json()).status === 'submitted'); }
        } catch (e) { labDone = false; }
        document.getElementById('session-indicator').innerHTML = labDone
            ? '<span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;">' +
              '<span style="color:var(--success);">Lab Complete!</span>' +
              '<button class="btn btn-secondary" style="padding:4px 12px;font-size:12px;" onclick="stopSession()">Close</button></span>'
            : '<span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;">' +
              '<span style="color:var(--text-muted);">\u2705 ' + escapeHtml(node) + ' passed \u2014 the lab is not finished yet</span></span>';
    }
}

async function stopSession() {
    if (!currentSession) return;
    try {
        var _r2 = await fetch('/api/sessions/' + currentSession + '/stop', { method: 'POST' });
        if (!_r2.ok && _r2.status !== 404) { throw new Error('HTTP ' + _r2.status); }
    } catch (e) { _stopFailed(e); return; }
    currentSession = null;
    currentLab = null;
    document.getElementById('active-session').classList.add('hidden');
    document.getElementById('session-indicator').innerHTML = '';
    document.getElementById('lab-catalog').classList.remove('hidden');
    loadLiveSessions();
    loadLabs();
}

// --- Fullscreen terminal ---------------------------------------------------
// One frame at a time. Clicking Expand lifts that terminal over the viewport;
// clicking it again (or pressing Escape) puts it back. Frames are created
// dynamically, so this listens on the document rather than binding per frame.
// The iframe is never re-created — only CSS changes — so the ttyd session and
// any scrollback survive the toggle.
function _termSetFullscreen(frame, on) {
    if (!frame) return;
    var btn = frame.querySelector('.term-btn');
    if (on) {
        frame.classList.add('fullscreen');
        document.body.classList.add('term-fullscreen-active');
        if (btn) {
            btn.innerHTML = '\u2715 Exit';
            btn.title = 'Return to grid view';
        }
    } else {
        frame.classList.remove('fullscreen');
        document.body.classList.remove('term-fullscreen-active');
        if (btn) {
            btn.innerHTML = '\u26f6 Expand';
            btn.title = 'Expand this terminal';
        }
    }
}

function _termToggleFullscreen(btn) {
    var frame = btn.closest('.terminal-frame');
    if (!frame) return;
    var goingFull = !frame.classList.contains('fullscreen');
    // Only one terminal can be fullscreen; collapse any other first.
    if (goingFull) {
        document.querySelectorAll('.terminal-frame.fullscreen').forEach(function(f) {
            if (f !== frame) _termSetFullscreen(f, false);
        });
    }
    _termSetFullscreen(frame, goingFull);
}

document.addEventListener('click', function(ev) {
    var btn = ev.target.closest && ev.target.closest('.term-btn');
    if (!btn) return;
    ev.preventDefault();
    _termToggleFullscreen(btn);
});

document.addEventListener('keydown', function(ev) {
    if (ev.key !== 'Escape') return;
    var open = document.querySelector('.terminal-frame.fullscreen');
    if (open) _termSetFullscreen(open, false);
});

// Surface live sessions on first paint too (not just after an action).
if (typeof window !== 'undefined') {
    window.addEventListener('DOMContentLoaded', function() { loadLiveSessions(); });
}

</script>
